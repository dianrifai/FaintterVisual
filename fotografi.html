    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <img id="lightbox-img" class="lightbox-img" src="" alt="" style="display:none;">
            <video id="lightbox-video" class="lightbox-img" style="display:none;width:100%;max-height:90vh;" controls>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script>
        function openLightbox(event, type, src) {
            event.stopPropagation();
            var lightbox = document.getElementById('lightbox');
            var imgEl = document.getElementById('lightbox-img');
            var videoEl = document.getElementById('lightbox-video');

            if (type === 'video') {
                imgEl.style.display = 'none';
                if (videoEl) {
                    videoEl.style.display = 'block';
                    videoEl.src = src;
                }
            } else {
                if (videoEl) videoEl.style.display = 'none';
                imgEl.style.display = 'block';
                imgEl.src = src;
            }
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            if (event && event.target.id !== 'lightbox') return;
            var lightbox = document.getElementById('lightbox');
            var videoEl = document.getElementById('lightbox-video');
            if (videoEl) videoEl.pause();
            lightbox.classList.remove('active');
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });

        // Lazy Loading Implementation
        document.addEventListener('DOMContentLoaded', function() {
            var images = document.querySelectorAll('img[src]:not([loading="eager"])');
            var videos = document.querySelectorAll('video[src]:not([loading="eager"])');
            
            if ('IntersectionObserver' in window) {
                var lazyLoadObserver = new IntersectionObserver(function(entries, observer) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            var el = entry.target;
                            if (el.tagName === 'IMG') {
                                el.src = el.dataset.src || el.src;
                                el.loading = 'eager';
                            } else if (el.tagName === 'VIDEO') {
                                el.src = el.dataset.src || el.src;
                            }
                            observer.unobserve(el);
                        }
                    });
                }, {
                    rootMargin: '50px',
                    threshold: 0.01
                });
                
                images.forEach(function(img) {
                    img.loading = 'lazy';
                    lazyLoadObserver.observe(img);
                });
                videos.forEach(function(video) {
                    lazyLoadObserver.observe(video);
                });
            } else {
                images.forEach(function(img) {
                    img.loading = 'lazy';
                });
            }
        });
    </script>
